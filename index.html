  <title>Consultorio</title>
  <meta name="description" content="Fichas de pacientes, historia clínica, turnos y pagos para profesionales de Kinesiología y Fisiatría.">

  <meta name="robots" content="noindex, nofollow">

  <link rel="apple-touch-icon" id="apple-icon" href="img/simbolo-180.png">

  <script src="js/tema.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="mobile-top no-print">
    <div class="mobile-brand-wrap" role="button" tabindex="0" data-abrir-marca aria-label="Cambiar logo, nombre y colores" title="Cambiar logo, nombre y colores">
      <img class="brand-symbol" data-marca="simbolo" alt="" width="40" height="40">
      <span class="mobile-brand"><span class="wordmark" data-marca="wordmark"></span><small class="brand-tag" data-marca="subtitulo"></small></span>
    </div>
    <button type="button" class="sync-dot" id="sync-dot" hidden></button>
    <button class="btn-icon" id="btn-lock-m" aria-label="Bloquear con clave" title="Bloquear con clave"></button>
  </header>

  <div class="layout">
    <aside class="sidebar no-print">
      <div class="brand">
        <div class="brand-edit" role="button" tabindex="0" data-abrir-marca aria-label="Cambiar logo, nombre y colores" title="Cambiar logo, nombre y colores">
          <img class="brand-logo" data-marca="logo" alt="" hidden>
          <div class="brand-name" data-marca="nombre-bloque" hidden></div>
          <span class="brand-edit-hint" aria-hidden="true">Cambiar logo y colores</span>
        </div>
        <small id="brand-sub">Kinesiología y Fisiatría</small>
        <button class="btn-icon" id="btn-lock" aria-label="Bloquear con clave" title="Bloquear con clave"></button>
      </div>
      <nav id="side-nav" class="side-nav" aria-label="Menú principal"></nav>
      <div class="sidebar-foot" id="sidebar-foot">Los datos se guardan en este dispositivo.<br>Hacé copias de seguridad en Ajustes.</div>
    </aside>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <nav id="bottom-nav" class="bottom-nav no-print" aria-label="Menú principal"></nav>

  <div id="modal-root" class="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <div id="lock-screen" class="lock-screen" hidden>
    <div class="lock-box">
      <img class="lock-logo" data-marca="logo" alt="" hidden>
      <div class="lock-name" data-marca="nombre-bloque" hidden></div>
      <h1>Ingresá tu clave</h1>
      <div class="pin-dots" aria-hidden="true"></div>
      <p class="pin-msg" role="alert"></p>
      <div class="pin-pad"></div>
    </div>
  </div>

  <div id="nube-screen" class="lock-screen nube-screen" hidden>
    <div class="lock-box nube-box">
      <img class="lock-logo" data-marca="logo" alt="" hidden>
      <div class="lock-name" data-marca="nombre-bloque" hidden></div>
      <div class="nube-content"></div>
    </div>
  </div>

  <noscript><p style="padding:2rem">Esta aplicación necesita JavaScript activado.</p></noscript>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/marca-ui.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/nube.js"></script>
  <script src="js/archivos.js"></script>
  <script src="js/pacientes.js"></script>
  <script src="js/agenda.js"></script>
  <script src="js/pagos.js"></script>
  <script src="js/inicio.js"></script>
  <script src="js/ajustes.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>

</html>
